name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Enable GitHub Pages from gh-pages branch
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/pages-post.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$payload")
          echo "POST /pages status: $code"
          cat /tmp/pages-post.json || true
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            curl -fL -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              -d "$payload"
          elif [ "$code" != "201" ]; then
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live GitHub Pages site
        run: |
          for i in $(seq 1 36); do
            if curl -fsSL "https://snatchpremier.github.io/LJT-Homepage/" -o /tmp/ljt-homepage.html && grep -q "Junteng Liu" /tmp/ljt-homepage.html; then
              echo "GitHub Pages site is live."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment... ($i/36)"
            sleep 10
          done
          echo "GitHub Pages site did not become available."
          exit 1
